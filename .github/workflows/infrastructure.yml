name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Infrastructure operation
        type: choice
        options: [Preview, Health, Destroy]
        default: Preview
        required: true
      confirmation:
        description: Type DESTROY-among-devs for destruction
        type: string
        default: ''
  schedule:
    - cron: '0 7 1 * *'

permissions:
  contents: read

jobs:
  infrastructure:
    if: github.repository == 'huxhamd/among-devs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: among-devs-play
    concurrency:
      group: among-devs-play
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run infrastructure operation
        shell: pwsh
        env:
          MODE: ${{ inputs.mode || 'Health' }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: ./scripts/infra.ps1 -Mode $env:MODE -AzureCommand az
