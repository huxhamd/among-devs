name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Infrastructure operation
        type: choice
        options: [Preview, Health, Destroy]
        default: Preview
        required: true
      confirmation:
        description: Type DESTROY-among-devs for destruction
        type: string
        default: ''
  schedule:
    - cron: '0 7 1 * *'

permissions:
  contents: read

jobs:
  infrastructure:
    if: github.repository == 'huxhamd/among-devs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: among-devs-play
    concurrency:
      group: among-devs-play
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run infrastructure operation
        shell: pwsh
        env:
          MODE: ${{ inputs.mode || 'Health' }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: ./scripts/infra.ps1 -Mode $env:MODE -AzureCommand az
