trigger: none
pr: none
schedules:
  - cron: '0 7 1 * *'
    displayName: Monthly authentication and infrastructure preview
    branches:
      include: [master]
    always: true
variables:
  - template: pipelines/variables.yml
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    path: s/app
  - template: pipelines/azure-step.yml
    parameters:
      mode: Health
