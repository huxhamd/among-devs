name: $(Date:yyyyMMdd).$(Rev:r)
trigger:
  batch: true
  branches:
    include: ['*']
pr:
  branches:
    include: [master]

resources:
  repositories:
    - repository: platformTemplates
      type: git
      name: platform-infrastructure/platform-infrastructure
      # container-app-v1.0.0, pinned to its immutable commit.
      ref: d2c456d0e343b67bc2b5379e764609edfbb5f36c

variables:
  - template: pipelines/variables.yml

stages:
  - stage: Validate
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            path: s/app
          - checkout: platformTemplates
            path: s/platform-templates
          - task: NodeTool@0
            inputs:
              versionSpec: 24.x
          - bash: |
              set -euo pipefail
              az bicep build --file ../platform-templates/templates/container-app/v1/infra/main.bicep --stdout > /dev/null
              npm ci
              docker build --tag "among-devs:$IMAGE_TAG" .
              docker run --detach --name among-devs-smoke --publish 3000:3000 --env ORIGIN=http://localhost:3000 "among-devs:$IMAGE_TAG"
              trap 'docker logs among-devs-smoke; docker rm --force among-devs-smoke' EXIT
              node scripts/smoke.mjs http://localhost:3000
              mkdir -p "$(Build.ArtifactStagingDirectory)/image"
              docker save "among-devs:$IMAGE_TAG" | gzip > "$(Build.ArtifactStagingDirectory)/image/among-devs.tar.gz"
            displayName: Check, test, build and smoke-test the production image
            workingDirectory: $(Pipeline.Workspace)/s/app
            env:
              IMAGE_TAG: $(Build.SourceVersion)
          - publish: $(Build.ArtifactStagingDirectory)/image
            artifact: image
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))

  - stage: Deploy
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
    lockBehavior: sequential
    jobs:
      - deployment: Deploy
        environment: among-devs-play
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  path: s/app
                - checkout: platformTemplates
                  path: s/platform-templates
                - download: current
                  artifact: image
                - task: NodeTool@0
                  inputs:
                    versionSpec: 24.x
                - bash: |
                    set -euo pipefail
                    docker load --input "$(Pipeline.Workspace)/image/among-devs.tar.gz"
                    npm ci --omit=dev
                  workingDirectory: $(Pipeline.Workspace)/s/app
                  displayName: Load the tested image and smoke-test client
                - template: pipelines/azure-step.yml
                  parameters:
                    mode: Deploy
