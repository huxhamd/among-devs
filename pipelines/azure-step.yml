parameters:
  - name: mode
    type: string
    values: [Preview, Deploy, Health, Destroy]
  - name: confirmation
    type: string
    default: ''
steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.mode }} personal application infrastructure
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: $(Pipeline.Workspace)/s/app/scripts/infra.ps1
      arguments: -Mode ${{ parameters.mode }} -AzureCommand az
      workingDirectory: $(Pipeline.Workspace)/s/app
      visibleAzLogin: false
    env:
      IMAGE_TAG: $(Build.SourceVersion)
      TEMPLATE_FILE: $(Pipeline.Workspace)/s/platform-templates/templates/container-app/v1/infra/main.bicep
      CONFIRMATION: ${{ parameters.confirmation }}
